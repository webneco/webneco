<svg width="900" height="470" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>

  <linearGradient id="cbg" x1="0" y1="0" x2="900" y2="470" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#000308"/>
    <stop offset="45%"  stop-color="#00100f">
      <animate attributeName="stop-color" values="#00100f;#001418;#00100f" dur="11s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#000308"/>
  </linearGradient>

  <linearGradient id="ctitle" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#5eead4"/>
    <stop offset="45%"  stop-color="#ffffff"/>
    <stop offset="70%"  stop-color="#34d399"/>
    <stop offset="100%" stop-color="#0d9488"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-260,0;260,0;-260,0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>

  <linearGradient id="crule" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#000308" stop-opacity="0"/>
    <stop offset="30%"  stop-color="#10b981" stop-opacity="0.6"/>
    <stop offset="70%"  stop-color="#22d3ee" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#000308" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="cscan" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#000308" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#2dd4bf" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#000308" stop-opacity="0"/>
  </linearGradient>

  <clipPath id="cclip"><rect width="900" height="470"/></clipPath>

  <!-- ── connector paths (referenced by the travelling packets) ── -->
  <path id="p_ab" d="M184,131 L234,131"/>
  <path id="p_bc" d="M384,131 L434,131"/>
  <path id="p_cd" d="M584,131 L634,131"/>

  <path id="p_d1" d="M709,158 C709,215 109,215 109,268"/>
  <path id="p_d2" d="M709,158 C709,215 309,215 309,268"/>
  <path id="p_d3" d="M709,158 C709,215 509,215 509,268"/>
  <path id="p_d4" d="M709,158 L709,268"/>

  <!-- recall brings the patient back round -->
  <path id="p_loop" d="M309,322 C309,378 70,392 34,352 C10,324 12,178 26,142"/>

</defs>

<rect width="900" height="470" fill="url(#cbg)"/>

<!-- grid -->
<g stroke="#10b981" stroke-width="0.4" stroke-opacity="0.06" fill="none">
  <animateTransform attributeName="transform" type="translate" values="0,0;0,-60" dur="12s" repeatCount="indefinite"/>
  <line x1="0" y1="0"   x2="900" y2="0"/>
  <line x1="0" y1="60"  x2="900" y2="60"/>
  <line x1="0" y1="120" x2="900" y2="120"/>
  <line x1="0" y1="180" x2="900" y2="180"/>
  <line x1="0" y1="240" x2="900" y2="240"/>
  <line x1="0" y1="300" x2="900" y2="300"/>
  <line x1="0" y1="360" x2="900" y2="360"/>
  <line x1="0" y1="420" x2="900" y2="420"/>
  <line x1="0" y1="480" x2="900" y2="480"/>
  <line x1="0" y1="530" x2="900" y2="530"/>
</g>

<!-- ambient glow -->
<ellipse cx="700" cy="140" rx="230" ry="120" fill="#0d9488" opacity="0">
  <animate attributeName="opacity" values="0;0.09;0.03;0.09;0" dur="9s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="180" cy="300" rx="220" ry="120" fill="#0891b2" opacity="0">
  <animate attributeName="opacity" values="0;0.05;0.09;0.04;0" dur="12s" repeatCount="indefinite"/>
</ellipse>

<!-- ── TITLE ── -->
<g opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze"/>
  <text x="30" y="44" font-family="Arial Black,Impact,sans-serif" font-size="27" font-weight="900" letter-spacing="-0.5" fill="url(#ctitle)">CAREFLOW CMS</text>
  <text x="30" y="64" font-family="monospace" font-size="10" fill="#5eead4" opacity="0.65" letter-spacing="1.6">MULTI-TENANT CLINIC OS  ·  WHATSAPP-NATIVE  ·  INSTALLABLE PWA</text>
</g>
<g opacity="0" font-family="monospace" font-size="9" text-anchor="end">
  <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
  <text x="870" y="38" fill="#94a3b8" letter-spacing="1.2">careflowcms.tech</text>
  <text x="870" y="54" fill="#5eead4" opacity="0.7" letter-spacing="1.2">Next.js 16 · React 19 · Prisma · PostgreSQL</text>
  <text x="870" y="70" fill="#5eead4" opacity="0.7" letter-spacing="1.2">NextAuth v5 · Razorpay · Gemini · Resend</text>
</g>
<rect x="0" y="80" width="0" height="1.4" fill="url(#crule)">
  <animate attributeName="width" values="0;900" dur="1.1s" begin="0.3s" fill="freeze"/>
  <animate attributeName="opacity" values="1;0.4;1" dur="5s" begin="1.4s" repeatCount="indefinite"/>
</rect>

<!-- ── CONNECTORS (draw themselves, then stay) ── -->
<g fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4">
  <use href="#p_ab" xlink:href="#p_ab" stroke-dasharray="50"  stroke-dashoffset="50" ><animate attributeName="stroke-dashoffset" values="50;0"  dur="0.35s" begin="1.0s" fill="freeze"/></use>
  <use href="#p_bc" xlink:href="#p_bc" stroke-dasharray="50"  stroke-dashoffset="50" ><animate attributeName="stroke-dashoffset" values="50;0"  dur="0.35s" begin="1.4s" fill="freeze"/></use>
  <use href="#p_cd" xlink:href="#p_cd" stroke-dasharray="50"  stroke-dashoffset="50" ><animate attributeName="stroke-dashoffset" values="50;0"  dur="0.35s" begin="1.8s" fill="freeze"/></use>
</g>
<g fill="none" stroke="#2dd4bf" stroke-width="1.3" stroke-opacity="0.32" stroke-dasharray="700" stroke-dashoffset="700">
  <use href="#p_d1" xlink:href="#p_d1"><animate attributeName="stroke-dashoffset" values="700;0" dur="1s" begin="2.2s" fill="freeze"/></use>
  <use href="#p_d2" xlink:href="#p_d2"><animate attributeName="stroke-dashoffset" values="700;0" dur="1s" begin="2.3s" fill="freeze"/></use>
  <use href="#p_d3" xlink:href="#p_d3"><animate attributeName="stroke-dashoffset" values="700;0" dur="1s" begin="2.4s" fill="freeze"/></use>
  <use href="#p_d4" xlink:href="#p_d4"><animate attributeName="stroke-dashoffset" values="700;0" dur="1s" begin="2.5s" fill="freeze"/></use>
</g>
<use href="#p_loop" xlink:href="#p_loop" fill="none" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.35" stroke-dasharray="6 5">
  <animate attributeName="stroke-dashoffset" values="110;0" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="stroke-opacity" values="0;0.35" dur="0.6s" begin="3s" fill="freeze"/>
</use>

<!-- arrow heads -->
<g fill="#10b981" opacity="0">
  <animate attributeName="opacity" values="0;0.65" dur="0.4s" begin="2.2s" fill="freeze"/>
  <polygon points="234,131 226,127 226,135"/>
  <polygon points="434,131 426,127 426,135"/>
  <polygon points="634,131 626,127 626,135"/>
</g>
<g fill="#2dd4bf" opacity="0">
  <animate attributeName="opacity" values="0;0.6" dur="0.4s" begin="3.2s" fill="freeze"/>
  <polygon points="109,268 105,260 113,260"/>
  <polygon points="309,268 305,260 313,260"/>
  <polygon points="509,268 505,260 513,260"/>
  <polygon points="709,268 705,260 713,260"/>
</g>
<polygon points="27,138 22,148 32,149" fill="#f59e0b" opacity="0">
  <animate attributeName="opacity" values="0;0.7" dur="0.4s" begin="3.6s" fill="freeze"/>
</polygon>

<!-- ── TRAVELLING PACKETS — the loop never stops ── -->
<g>
  <circle r="3" fill="#5eead4"><animateMotion dur="1.1s" begin="3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p_ab" xlink:href="#p_ab"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="1.1s" repeatCount="indefinite"/></circle>
  <circle r="3" fill="#5eead4"><animateMotion dur="1.1s" begin="3.4s" repeatCount="indefinite"><mpath href="#p_bc" xlink:href="#p_bc"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="3.4s" repeatCount="indefinite"/></circle>
  <circle r="3" fill="#5eead4"><animateMotion dur="1.1s" begin="3.8s" repeatCount="indefinite"><mpath href="#p_cd" xlink:href="#p_cd"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="3.8s" repeatCount="indefinite"/></circle>

  <circle r="3.4" fill="#34d399"><animateMotion dur="2.4s" begin="4.2s" repeatCount="indefinite"><mpath href="#p_d1" xlink:href="#p_d1"/></animateMotion></circle>
  <circle r="3.4" fill="#34d399"><animateMotion dur="2.4s" begin="4.5s" repeatCount="indefinite"><mpath href="#p_d2" xlink:href="#p_d2"/></animateMotion></circle>
  <circle r="3.4" fill="#34d399"><animateMotion dur="2.4s" begin="4.8s" repeatCount="indefinite"><mpath href="#p_d3" xlink:href="#p_d3"/></animateMotion></circle>
  <circle r="3.4" fill="#22c55e"><animateMotion dur="2.4s" begin="5.1s" repeatCount="indefinite"><mpath href="#p_d4" xlink:href="#p_d4"/></animateMotion></circle>

  <circle r="3.2" fill="#fbbf24"><animateMotion dur="4s" begin="5.5s" repeatCount="indefinite"><mpath href="#p_loop" xlink:href="#p_loop"/></animateMotion><animate attributeName="opacity" values="0.2;1;1;0.2" dur="4s" begin="5.5s" repeatCount="indefinite"/></circle>
</g>

<!-- ── ROW 1 NODES ── -->
<g font-family="monospace">
  <!-- PATIENT -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,12;0,0" dur="0.5s" begin="0.8s" fill="freeze"/>
    <rect x="34" y="104" width="150" height="54" rx="9" fill="#04140f" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="48" y="126" font-size="11.5" fill="#e2e8f0" font-weight="bold" letter-spacing="0.6">👤 PATIENT</text>
    <text x="48" y="143" font-size="8" fill="#5eead4" opacity="0.7" letter-spacing="0.8">register · CF-code · WA no.</text>
  </g>
  <!-- APPOINTMENT -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,12;0,0" dur="0.5s" begin="1.2s" fill="freeze"/>
    <rect x="234" y="104" width="150" height="54" rx="9" fill="#04140f" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="248" y="126" font-size="11.5" fill="#e2e8f0" font-weight="bold" letter-spacing="0.6">📅 APPOINTMENT</text>
    <text x="248" y="143" font-size="8" fill="#5eead4" opacity="0.7" letter-spacing="0.8">slot check · WA confirm</text>
  </g>
  <!-- CONSULTATION -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,12;0,0" dur="0.5s" begin="1.6s" fill="freeze"/>
    <rect x="434" y="104" width="150" height="54" rx="9" fill="#04140f" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="448" y="126" font-size="11.5" fill="#e2e8f0" font-weight="bold" letter-spacing="0.6">🩺 CONSULTATION</text>
    <text x="448" y="143" font-size="8" fill="#5eead4" opacity="0.7" letter-spacing="0.8">vitals · Dx · Rx · line items</text>
  </g>
  <!-- CONFIRM — the atomic step, pulses forever -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,12;0,0" dur="0.5s" begin="2s" fill="freeze"/>
    <rect x="634" y="104" width="150" height="54" rx="9" fill="#160800" stroke="#f97316" stroke-width="1.4">
      <animate attributeName="stroke-opacity" values="0.95;0.35;0.95" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="630" y="100" width="158" height="62" rx="12" fill="none" stroke="#f97316" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0;0.35" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="width"  values="158;172;158" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="62;74;62"    dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="x"      values="630;623;630" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="100;94;100"  dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="648" y="126" font-size="11.5" fill="#ffedd5" font-weight="bold" letter-spacing="0.6">⚡ CONFIRM VISIT</text>
    <text x="648" y="143" font-size="7.5" fill="#fdba74" opacity="0.85" letter-spacing="0.4">one atomic API transaction</text>
  </g>
</g>

<!-- fan-out caption -->
<rect x="270" y="226" width="360" height="16" fill="#000a0b" opacity="0">
  <animate attributeName="opacity" values="0;0.85" dur="0.6s" begin="3.2s" fill="freeze"/>
</rect>
<text x="450" y="238" font-family="monospace" font-size="8.5" fill="#94a3b8" text-anchor="middle" letter-spacing="2.4" opacity="0">
  ONE TAP  →  FOUR SIDE EFFECTS, FIRE-AND-FORGET
  <animate attributeName="opacity" values="0;0.75" dur="0.6s" begin="3.2s" fill="freeze"/>
  <animate attributeName="opacity" values="0.75;0.35;0.75" dur="4s" begin="4s" repeatCount="indefinite"/>
</text>

<!-- ── ROW 2 OUTPUTS ── -->
<g font-family="monospace">
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.2s" fill="freeze"/>
    <rect x="24" y="268" width="170" height="54" rx="9" fill="#04140f" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="38" y="290" font-size="11" fill="#e2e8f0" font-weight="bold" letter-spacing="0.5">🧾 INVOICE + PDF</text>
    <text x="38" y="307" font-size="7.5" fill="#67e8f9" opacity="0.7" letter-spacing="0.6">INV-{year}-{seq} · on demand</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.35s" fill="freeze"/>
    <rect x="224" y="268" width="170" height="54" rx="9" fill="#04140f" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="238" y="290" font-size="11" fill="#e2e8f0" font-weight="bold" letter-spacing="0.5">🔁 RECALL</text>
    <text x="238" y="307" font-size="7.5" fill="#67e8f9" opacity="0.7" letter-spacing="0.6">next checkup · daily cron</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.5s" fill="freeze"/>
    <rect x="424" y="268" width="170" height="54" rx="9" fill="#04140f" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="438" y="290" font-size="11" fill="#e2e8f0" font-weight="bold" letter-spacing="0.5">⭐ REVIEW GATE</text>
    <text x="438" y="307" font-size="7.5" fill="#67e8f9" opacity="0.7" letter-spacing="0.6">≥4★ → Google · &lt;4★ private</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.65s" fill="freeze"/>
    <rect x="654" y="268" width="170" height="54" rx="9" fill="#04140f" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="668" y="290" font-size="11" fill="#e2e8f0" font-weight="bold" letter-spacing="0.5">💬 WHATSAPP</text>
    <text x="668" y="307" font-size="7.5" fill="#86efac" opacity="0.75" letter-spacing="0.6">Meta Cloud API · templates</text>
    <circle cx="812" cy="280" r="3" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
</g>

<!-- loop label -->
<text x="150" y="382" font-family="monospace" font-size="8" fill="#fbbf24" opacity="0" letter-spacing="1.4">
  recall brings the patient back → next visit
  <animate attributeName="opacity" values="0;0.7" dur="0.6s" begin="4s" fill="freeze"/>
</text>

<!-- ── MODULE CHIPS ── -->
<text x="30" y="404" font-family="monospace" font-size="8" fill="#5eead4" opacity="0" letter-spacing="2">
  9 MODULES, ONE TENANT BOUNDARY (clinicId on every row)
  <animate attributeName="opacity" values="0;0.7" dur="0.5s" begin="4.2s" fill="freeze"/>
</text>
<g font-family="monospace" font-size="7.5" text-anchor="middle">
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="4.4s"  fill="freeze"/><rect x="18"  y="414" width="92" height="22" rx="6" fill="#04140f" stroke="#10b981" stroke-opacity="0.35"/><text x="64"  y="428" fill="#a7f3d0">PATIENTS</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="4.5s"  fill="freeze"/><rect x="114" y="414" width="92" height="22" rx="6" fill="#04140f" stroke="#10b981" stroke-opacity="0.35"/><text x="160" y="428" fill="#a7f3d0">APPOINTMENTS</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="4.6s"  fill="freeze"/><rect x="210" y="414" width="92" height="22" rx="6" fill="#04140f" stroke="#10b981" stroke-opacity="0.35"/><text x="256" y="428" fill="#a7f3d0">CONSULTATIONS</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="4.7s"  fill="freeze"/><rect x="306" y="414" width="92" height="22" rx="6" fill="#04140f" stroke="#10b981" stroke-opacity="0.35"/><text x="352" y="428" fill="#a7f3d0">BILLING</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="4.8s"  fill="freeze"/><rect x="402" y="414" width="92" height="22" rx="6" fill="#04140f" stroke="#10b981" stroke-opacity="0.35"/><text x="448" y="428" fill="#a7f3d0">ENGAGEMENT</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="4.9s"  fill="freeze"/><rect x="498" y="414" width="92" height="22" rx="6" fill="#04140f" stroke="#10b981" stroke-opacity="0.35"/><text x="544" y="428" fill="#a7f3d0">REVIEWS</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="5.0s"  fill="freeze"/><rect x="594" y="414" width="92" height="22" rx="6" fill="#04140f" stroke="#10b981" stroke-opacity="0.35"/><text x="640" y="428" fill="#a7f3d0">FOLLOW-UPS</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="5.1s"  fill="freeze"/><rect x="690" y="414" width="92" height="22" rx="6" fill="#04140f" stroke="#10b981" stroke-opacity="0.35"/><text x="736" y="428" fill="#a7f3d0">MARKETING</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="5.2s"  fill="freeze"/><rect x="786" y="414" width="92" height="22" rx="6" fill="#04140f" stroke="#10b981" stroke-opacity="0.35"/><text x="832" y="428" fill="#a7f3d0">REPORTS</text></g>
</g>

<!-- scan sweep -->
<rect x="0" y="0" width="900" height="2" fill="url(#cscan)" opacity="0.45" clip-path="url(#cclip)">
  <animateTransform attributeName="transform" type="translate" values="0,-3;0,473" dur="5.5s" repeatCount="indefinite"/>
</rect>

<rect x="0" y="0"   width="900" height="1.6" fill="url(#crule)" opacity="0.5"/>
<rect x="0" y="452" width="900" height="1.6" fill="url(#crule)" opacity="0.45">
  <animate attributeName="opacity" values="0.45;0.85;0.45" dur="3.4s" repeatCount="indefinite"/>
</rect>

</svg>
