<svg width="900" height="14" viewBox="0 0 900 14" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="dbase" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#000308" stop-opacity="0"/>
    <stop offset="25%"  stop-color="#ea580c" stop-opacity="0.45"/>
    <stop offset="75%"  stop-color="#10b981" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#000308" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="dpulse" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#f97316" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#fed7aa" stop-opacity="1"/>
    <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="dclip"><rect x="0" y="0" width="900" height="14"/></clipPath>
</defs>

<g clip-path="url(#dclip)">
  <!-- base rule -->
  <rect x="0" y="6" width="900" height="1.6" fill="url(#dbase)">
    <animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- tick marks -->
  <g fill="#f97316" opacity="0.28">
    <rect x="0"   y="3" width="1.2" height="8"/>
    <rect x="150" y="4" width="1.2" height="6"/>
    <rect x="300" y="3" width="1.2" height="8"/>
    <rect x="450" y="1" width="1.6" height="12"/>
    <rect x="600" y="3" width="1.2" height="8"/>
    <rect x="750" y="4" width="1.2" height="6"/>
    <rect x="898" y="3" width="1.2" height="8"/>
  </g>

  <!-- travelling pulse -->
  <rect x="-220" y="5.4" width="220" height="2.6" fill="url(#dpulse)" rx="1.3">
    <animateTransform attributeName="transform" type="translate" values="0,0;1120,0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- chaser dot -->
  <circle cy="7" r="2.6" fill="#fbbf24" opacity="0.9">
    <animate attributeName="cx" values="-10;910" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="r"  values="2.6;3.6;2.6" dur="1.1s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
